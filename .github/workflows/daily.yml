name: Daily AI Movers Agent

on:
  schedule:
    # 21:30 UTC, Mon-Fri = after 4pm US market close year-round (4:30pm EST / 5:30pm EDT).
    # GitHub cron only understands UTC, so this doesn't shift with daylight saving.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {} # lets you trigger a run by hand from the Actions tab, for testing

permissions:
  contents: write # needed to commit the day's report back to the repo

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the agent
        id: run_agent
        working-directory: src
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and push today's report, if any
        run: |
          git config user.name "ai-movers-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p reports
          if [ -z "$(git status --porcelain reports/)" ]; then
            echo "No new report to commit (non-trading day or already up to date)."
            exit 0
          fi
          git add reports/
          git commit -m "Daily report: $(date -u +%F)"
          git push

      - name: Email run result
        if: always() # send on success AND failure, not just failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ladykena2000@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: AI Movers Agent
          to: ladykena2000@gmail.com
          subject: "AI Movers Agent - ${{ steps.run_agent.outcome == 'success' && 'success' || 'FAILED' }} - ${{ github.run_id }}"
          body: |
            Run outcome: ${{ steps.run_agent.outcome == 'success' && 'success' || 'FAILED' }}

            View full logs and any generated report here:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
