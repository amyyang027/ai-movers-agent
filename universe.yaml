# Universe for the Daily AI Movers Agent.
# Must be reviewed by the team and frozen by Day 3 (see task doc).
# 10 themes, 50 stocks (5 per theme). Each theme's return is the equal-weighted
# average of its own stocks' returns (type: basket) - simplest way to keep the
# theme ranking and the stock ranking self-consistent.

themes:
  - name: AI Chips & Semiconductors
    type: basket
    tickers: [NVDA, AMD, AVGO, TSM, QCOM, MU]
    reason: Chips that power AI training and inference workloads.
  - name: Cloud & AI Infrastructure
    type: basket
    tickers: [MSFT, AMZN, GOOGL, ORCL, IBM]
    reason: Hyperscale cloud platforms hosting and building AI models/services.
  - name: Enterprise AI Software
    type: basket
    tickers: [CRM, NOW, ADBE, PLTR, WDAY]
    reason: Software companies embedding AI/agents into business applications.
  - name: Cybersecurity AI
    type: basket
    tickers: [CRWD, PANW, ZS, S, FTNT]
    reason: Security vendors using AI/ML for threat detection and response.
  - name: AI Data & Analytics
    type: basket
    tickers: [SNOW, MDB, DDOG, ESTC, AI]
    reason: Data platforms enabling AI training, retrieval, and real-time analytics.
  - name: Robotics & Industrial Automation
    type: basket
    tickers: [ISRG, ROK, CGNX, TER, SYM]
    reason: Physical AI - robotics and automation hardware/software.
  - name: Autonomous Vehicles & Mobility AI
    type: basket
    tickers: [TSLA, MBLY, APTV, UBER, GM]
    reason: AI-driven self-driving and mobility technology.
  - name: Consumer Internet & AI Platforms
    type: basket
    tickers: [META, NFLX, SPOT, PINS, TTD]
    reason: Consumer platforms using AI for recommendations, personalization, ad targeting.
  - name: AI Networking & Data Center Infrastructure
    type: basket
    tickers: [ANET, CSCO, VRT, EQIX, DELL]
    reason: Networking, power, and data center infrastructure that AI compute depends on.
  - name: Healthcare AI
    type: basket
    tickers: [TEM, VEEV, DOCS, GEHC]
    reason: AI applied to healthcare data, diagnostics, and clinical/commercial workflows.

